[package]
name = "native-beam-seed"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-dialyzer-poc = { path = "../../.." }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
elixir-frontend = { path = "../elixir" }

[[bin]]
name = "native-beam-seed"
path = "main.rs"

[lib]
path = "lib.rs"
