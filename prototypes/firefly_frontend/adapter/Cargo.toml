[package]
name = "firefly-core-adapter"
version = "0.1.0"
edition = "2021"
[lib]
path = "source.rs"
[dependencies]
rust-dialyzer-poc = { path = "../../.." }
native-beam-seed = { path = "../input" }
serde_json = "1"
firefly_syntax_core = { path = "../compiler/compiler/syntax_core" }
firefly_syntax_base = { path = "../compiler/compiler/syntax_base" }
firefly_diagnostics = { path = "../compiler/compiler/diagnostics" }
firefly_binary = { path = "../compiler/library/binary", features = ["std"] }
firefly_beam = { path = "../compiler/library/beam", features = ["std"] }
firefly_syntax_erl = { path = "../compiler/compiler/syntax_erl" }
firefly_pass = { path = "../compiler/compiler/pass" }
firefly_util = { path = "../compiler/compiler/util" }
firefly_intern = { path = "../compiler/compiler/intern", features = ["std"] }
anyhow = "1"
[[bin]]
name = "adapt-beam"
path = "driver.rs"
