[package]
name = "rust-dialyzer-poc"
version = "0.1.0"
edition = "2024"
default-run = "rust-dialyzer-poc"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
num-bigint = "0.4.6"
num-traits = "0.2.19"
im = "15.1.0"
mimalloc = { version = "0.1", default-features = false }

ryu = "=1.0.22"
unicode-segmentation = "=1.12.0"
